name: Patch ETF discovery v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_discovery_v2.py'
      - '.github/workflows/patch-discovery-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply discovery patch
        run: python scripts/patch_discovery_v2.py
      - name: Commit updater changes
        run: |
          if git diff --quiet -- scripts/update_market_data.py; then
            echo "No updater changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_market_data.py
          git commit -m "Improve automatic ETF discovery"
          git pull --rebase origin main
          git push
