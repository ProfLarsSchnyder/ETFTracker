name: Patch expanded ETF universe UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_universe_ui.py'
      - '.github/workflows/patch-universe-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python scripts/patch_universe_ui.py
      - name: Commit UI changes
        run: |
          if git diff --quiet -- app.js index.html; then
            echo "No UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Improve ETF radar for expanded universe"
          git push
